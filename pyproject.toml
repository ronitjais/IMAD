[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "imad"
version = "0.1.0"
description = "Research-oriented multimodal fake content detection"
requires-python = ">=3.10"
dependencies = ["numpy==2.1.3", "Pillow==11.0.0", "PyYAML==6.0.2"]

[project.optional-dependencies]
image = ["torch>=2.5", "torchvision>=0.20", "scikit-learn==1.5.2", "pandas==2.2.3", "matplotlib==3.9.2"]
api = ["fastapi==0.115.5", "uvicorn[standard]==0.32.1", "python-multipart==0.0.17"]
text = ["transformers==4.46.3", "datasets==3.1.0", "scikit-learn==1.5.2"]
dev = ["pytest==8.3.3", "ruff==0.8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests", "backend/tests"]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 100
target-version = "py310"
